name: Deploy Black Friday App

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC sub:', payload.sub);
            console.log('OIDC aud:', payload.aud);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::678878256416:role/fatmiGithubActioncicdROLE
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t blackfri .

      - name: Tag Docker image
        run: docker tag blackfri:latest 678878256416.dkr.ecr.us-east-1.amazonaws.com/black-friday-app:latest

      - name: Push Docker image
        run: docker push 678878256416.dkr.ecr.us-east-1.amazonaws.com/black-friday-app:latest